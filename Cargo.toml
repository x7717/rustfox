[workspace]
resolver = "2"
members = [
    "crates/rustfox-dom",
    "crates/rustfox-style",
    "crates/rustfox-simd",
    "crates/rustfox-url",
    "crates/rustfox-html",
    "crates/rustfox-http1",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[profile.release]
debug = true        # symbols for FlameGraph
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
lto = "thin"
codegen-units = 1
